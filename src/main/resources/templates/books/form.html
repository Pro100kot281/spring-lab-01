<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{fragments/layout :: head(${editing} ? #{book.edit} : #{book.new})}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="container">
    <a class="breadcrumb" th:href="${editing} ? @{/books/{id}(id=${bookId})} : @{/books}" href="/books">
        ← <span th:text="#{book.back}">Back to catalogue</span>
    </a>

    <div class="page-head">
        <div>
            <h1 th:text="${editing} ? #{book.edit} : #{book.new}">New book</h1>
            <p class="lead" th:text="${editing} ? #{form.edit.lead} : #{form.new.lead}">Fill in the details…</p>
        </div>
    </div>

    <form class="card card-pad form-card" method="post" novalidate
          th:action="${editing} ? @{/books/{id}(id=${bookId})} : @{/books}" action="/books"
          th:object="${form}">

        <div class="alert alert-danger" th:if="${#fields.hasAnyErrors()}">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5v.01"/></svg>
            <span th:text="#{form.errors}">Please fix the highlighted fields.</span>
        </div>

        <div class="field">
            <label for="title" th:text="#{book.title}">Title</label>
            <input type="text" th:field="*{title}" th:errorclass="is-invalid" th:placeholder="#{book.title.placeholder}" maxlength="120">
            <span class="field-error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}">Error</span>
        </div>

        <div class="field">
            <label for="author" th:text="#{book.author}">Author</label>
            <input type="text" th:field="*{author}" th:errorclass="is-invalid" th:placeholder="#{book.author.placeholder}">
            <span class="field-error" th:if="${#fields.hasErrors('author')}" th:errors="*{author}">Error</span>
        </div>

        <div class="field-row">
            <div class="field">
                <label for="year" th:text="#{book.year}">Year</label>
                <input type="number" th:field="*{year}" th:errorclass="is-invalid" min="1450" max="2100" th:placeholder="#{book.year.placeholder}">
                <span class="field-error" th:if="${#fields.hasErrors('year')}" th:errors="*{year}">Error</span>
            </div>
            <div class="field">
                <label for="genre" th:text="#{book.genre}">Genre</label>
                <select th:field="*{genre}" th:errorclass="is-invalid">
                    <option value="" th:text="#{book.genre.choose}">Choose a genre</option>
                    <option th:each="g : ${genres}" th:value="${g}" th:text="#{${'genre.' + g}}">Fiction</option>
                </select>
                <span class="field-error" th:if="${#fields.hasErrors('genre')}" th:errors="*{genre}">Error</span>
            </div>
        </div>

        <div class="form-actions">
            <a class="btn btn-ghost" th:href="${editing} ? @{/books/{id}(id=${bookId})} : @{/books}" href="/books"
               th:text="#{form.cancel}">Cancel</a>
            <button class="btn btn-primary" type="submit" th:text="#{form.submit}">Save</button>
        </div>
    </form>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
