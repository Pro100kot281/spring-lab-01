<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{fragments/layout :: head(${book.title()})}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="container">
    <a class="breadcrumb" th:href="@{/books}" href="/books">← <span th:text="#{book.back}">Back to catalogue</span></a>

    <div class="alert alert-success" th:if="${flashKey}">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
        <span th:text="#{${flashKey}(${flashTitle})}">Book has been updated</span>
    </div>

    <article class="card card-pad details">
        <span class="cover cover-lg" th:classappend="'g-' + ${book.genre()}"
              th:text="${#strings.toUpperCase(#strings.substring(book.title(), 0, 1))}">E</span>
        <div>
            <span class="badge" th:classappend="'g-' + ${book.genre()}" th:text="#{${'genre.' + book.genre()}}">Non-fiction</span>
            <h1 th:text="${book.title()}">Effective Java</h1>
            <p class="by" th:text="${book.author()}">Joshua Bloch</p>

            <dl class="dl">
                <div><dt th:text="#{book.year}">Year</dt><dd th:text="${book.year()}">2018</dd></div>
                <div><dt th:text="#{book.id}">ID</dt><dd class="mono" th:text="'#' + ${book.id()}">#1</dd></div>
                <div><dt th:text="#{book.created}">Added</dt><dd th:text="${createdAt}">27.10.2026 11:00</dd></div>
            </dl>

            <div class="details-actions">
                <a class="btn btn-primary" th:href="@{/books/{id}/edit(id=${book.id()})}" href="#">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
                    <span th:text="#{book.edit.action}">Edit</span>
                </a>
                <form th:action="@{/books/{id}/delete(id=${book.id()})}" method="post"
                      th:attr="data-confirm=#{book.delete.confirm}"
                      onsubmit="return confirm(this.dataset.confirm)">
                    <button class="btn btn-danger" type="submit">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>
                        <span th:text="#{book.delete}">Delete</span>
                    </button>
                </form>
                <a class="btn btn-ghost" th:href="@{/api/books/{id}(id=${book.id()})}" href="#" target="_blank">JSON ↗</a>
            </div>
        </div>
    </article>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
