<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{fragments/layout :: head(#{catalogue.title})}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="container">
    <div class="page-head">
        <div>
            <span class="eyebrow" th:text="#{catalogue.lead}">All books in the collection</span>
            <h1 th:text="#{catalogue.title}">Catalogue</h1>
        </div>
        <a class="btn btn-primary" th:href="@{/books/new}" href="/books/new">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
            <span th:text="#{nav.new}">Add book</span>
        </a>
    </div>

    <div class="alert alert-success" th:if="${flashKey}">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
        <span th:text="#{${flashKey}(${flashTitle})}">Book has been added</span>
    </div>

    <div class="card">
        <div class="toolbar">
            <form class="search" th:action="@{/books}" action="/books" method="get" role="search">
                <label class="sr-only" for="author" th:text="#{catalogue.search}">Filter by author</label>
                <div class="input-icon">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
                    <input type="search" id="author" name="author" th:value="${author}"
                           th:placeholder="#{catalogue.search.placeholder}" placeholder="e.g. Bloch">
                </div>
                <button class="btn btn-ghost" type="submit" th:text="#{catalogue.search.button}">Search</button>
                <a class="btn btn-ghost" th:if="${author != null and !#strings.isEmpty(author)}"
                   th:href="@{/books}" href="/books" th:text="#{catalogue.search.clear}">Clear</a>
            </form>
            <span class="muted" th:text="#{catalogue.count(${#lists.size(books)}, ${total})}">3 of 3 books</span>
        </div>

        <div class="table-wrap" th:unless="${#lists.isEmpty(books)}">
            <table class="table">
                <thead>
                <tr>
                    <th th:text="#{book.id}">ID</th>
                    <th th:text="#{book.title}">Title</th>
                    <th th:text="#{book.author}">Author</th>
                    <th th:text="#{book.year}">Year</th>
                    <th th:text="#{book.genre}">Genre</th>
                    <th class="th-right" th:text="#{catalogue.actions}">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="book : ${books}">
                    <td class="num" th:text="${book.id()}">1</td>
                    <td>
                        <div class="title-cell">
                            <span class="cover" th:classappend="'g-' + ${book.genre()}"
                                  th:text="${#strings.toUpperCase(#strings.substring(book.title(), 0, 1))}">E</span>
                            <a th:href="@{/books/{id}(id=${book.id()})}" href="#" th:text="${book.title()}">Effective Java</a>
                        </div>
                    </td>
                    <td th:text="${book.author()}">Joshua Bloch</td>
                    <td th:text="${book.year()}">2018</td>
                    <td><span class="badge" th:classappend="'g-' + ${book.genre()}"
                              th:text="#{${'genre.' + book.genre()}}">Non-fiction</span></td>
                    <td>
                        <div class="actions">
                            <a class="btn btn-ghost btn-sm" th:href="@{/books/{id}/edit(id=${book.id()})}" href="#"
                               th:text="#{book.edit.action}">Edit</a>
                            <form th:action="@{/books/{id}/delete(id=${book.id()})}" method="post"
                                  th:attr="data-confirm=#{book.delete.confirm}"
                                  onsubmit="return confirm(this.dataset.confirm)">
                                <button class="btn btn-danger btn-sm btn-icon" type="submit" th:title="#{book.delete}" title="Delete">
                                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="empty" th:if="${#lists.isEmpty(books)}">
            <span class="icon-badge"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></span>
            <h3 th:text="#{catalogue.empty}">No books found</h3>
            <p th:text="#{catalogue.empty.hint}">Try another author name or add a new book.</p>
            <a class="btn btn-primary" th:href="@{/books/new}" href="/books/new" th:text="#{nav.new}">Add book</a>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
