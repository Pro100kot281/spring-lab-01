<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(pageTitle)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle} + ' · ' + #{app.name}">Bookshelf</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap&subset=cyrillic">
    <link rel="stylesheet" th:href="@{/css/app.css}" href="../../static/css/app.css">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231f5c4d'/%3E%3Cpath d='M10 8h9a3 3 0 0 1 3 3v13H13a3 3 0 0 1-3-3z' fill='white'/%3E%3C/svg%3E">
</head>
<body>

<header class="site-header" th:fragment="header">
    <nav class="container nav">
        <a class="brand" th:href="@{/}" href="/">
            <span class="brand-mark">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
            </span>
            <span class="brand-name" th:text="#{app.name}">Bookshelf</span>
        </a>

        <input type="checkbox" id="nav-toggle" class="nav-toggle sr-only">
        <label for="nav-toggle" class="nav-burger" aria-label="Menu"><span></span></label>

        <div class="nav-links">
            <a th:href="@{/}" href="/" th:classappend="${activePage == 'home'} ? 'active'" th:text="#{nav.home}">Home</a>
            <a th:href="@{/books}" href="/books" th:classappend="${activePage == 'books'} ? 'active'" th:text="#{nav.catalogue}">Catalogue</a>
            <a th:href="@{/books/new}" href="/books/new" th:classappend="${activePage == 'new'} ? 'active'" th:text="#{nav.new}">Add book</a>
            <a th:href="@{/tools}" href="/tools" th:classappend="${activePage == 'tools'} ? 'active'" th:text="#{nav.tools}">Tools</a>
            <a th:href="@{/about}" href="/about" th:classappend="${activePage == 'about'} ? 'active'" th:text="#{nav.about}">About</a>
            <a class="ext" th:href="@{/swagger-ui.html}" href="/swagger-ui.html" th:text="#{nav.api}">API docs</a>

            <div class="lang-switch" th:attr="aria-label=#{nav.language}">
                <a th:href="@{''(lang=en)}" href="?lang=en"
                   th:classappend="${#locale.language != 'ru'} ? 'active'">EN</a>
                <a th:href="@{''(lang=ru)}" href="?lang=ru"
                   th:classappend="${#locale.language == 'ru'} ? 'active'">RU</a>
            </div>
        </div>
    </nav>
</header>

<footer class="site-footer" th:fragment="footer">
    <div class="container">
        <span>
            <strong th:text="#{app.name}">Bookshelf</strong> ·
            <span th:text="${appOwner}">Owner</span>
        </span>
        <span th:text="#{footer.made}">Built with Spring Boot &amp; Thymeleaf</span>
    </div>
</footer>

</body>
</html>
