<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{fragments/layout :: head(#{error.title} + ' ' + ${status})}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="container">
    <section class="error-page">
        <div class="error-code" th:text="${status}">404</div>
        <th:block th:switch="${status}">
            <th:block th:case="404">
                <h1 th:text="#{error.404.title}">Page not found</h1>
                <p th:text="#{error.404.text}">The page you are looking for doesn't exist.</p>
            </th:block>
            <th:block th:case="500">
                <h1 th:text="#{error.500.title}">Something went wrong</h1>
                <p th:text="#{error.500.text}">An unexpected error occurred.</p>
            </th:block>
            <th:block th:case="*">
                <h1 th:text="${error}">Error</h1>
                <p th:text="#{error.generic.text}">The request could not be completed.</p>
            </th:block>
        </th:block>
        <div class="hero-actions">
            <a class="btn btn-primary" th:href="@{/}" href="/" th:text="#{error.home}">Go home</a>
            <a class="btn btn-ghost" th:href="@{/books}" href="/books" th:text="#{error.catalogue}">Open catalogue</a>
        </div>
        <p class="path mono" th:if="${path}" th:text="${path}">/missing</p>
    </section>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
